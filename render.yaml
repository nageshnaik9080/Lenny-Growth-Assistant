databases:
  - name: lenny-postgres
    databaseName: lenny_assistant
    user: lenny
    plan: free

services:
  - type: web
    name: lenny-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lenny-postgres
          property: connectionString
      - key: DEFAULT_LLM_PROVIDER
        value: anthropic
      - key: CLOUD_PROVIDER
        value: anthropic
      - key: ANTHROPIC_MODEL
        value: claude-3-5-sonnet-20241022
      - key: ANTHROPIC_API_KEY
        value: ""
      - key: OPENAI_MODEL
        value: gpt-4o
      - key: OPENAI_API_KEY
        value: ""
      - key: EMBEDDING_MODEL
        value: sentence-transformers/all-MiniLM-L6-v2
      - key: RETRIEVAL_TOP_K
        value: "5"
      - key: RETRIEVAL_THRESHOLD
        value: "0.65"
      - key: MAX_HISTORY_MESSAGES
        value: "12"
      - key: LOG_LEVEL
        value: INFO
      - key: CORS_ORIGINS
        value: https://lenny-frontend-csll.onrender.com

  - type: web
    name: lenny-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://lenny-backend-20wq.onrender.com
