##############################################################
# Render Blueprint — Lenny Growth Assistant
# https://render.com/docs/blueprint-spec
#
# SECRETS — add these manually in the Render dashboard under
# the "lenny-backend" service → Environment:
#
#   ANTHROPIC_API_KEY   your Anthropic key  (if DEFAULT_LLM_PROVIDER=anthropic)
#   OPENAI_API_KEY      your OpenAI key     (if DEFAULT_LLM_PROVIDER=openai)
#
# Never commit real keys to this file.
##############################################################

databases:
  - name: lenny-postgres
    databaseName: lenny_assistant
    user: lenny
    plan: free

services:
  # ── BACKEND ───────────────────────────────────────────────
  - type: web
    name: lenny-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      # Render injects PORT at runtime; Dockerfile CMD uses ${PORT:-8000}
      # DATABASE_URL is populated from the managed Postgres above.
      # database.py normalises postgres:// → postgresql+asyncpg:// automatically.
      - key: DATABASE_URL
        fromDatabase:
          name: lenny-postgres
          property: connectionString

      - key: DEFAULT_LLM_PROVIDER
        value: openai

      - key: CLOUD_PROVIDER
        value: openai

      - key: ANTHROPIC_MODEL
        value: claude-3-5-sonnet-20241022

      - key: OPENAI_MODEL
        value: gpt-4o

      - key: EMBEDDING_MODEL
        value: sentence-transformers/all-MiniLM-L6-v2

      - key: RETRIEVAL_TOP_K
        value: "5"

      - key: RETRIEVAL_THRESHOLD
        value: "0.65"

      - key: MAX_HISTORY_MESSAGES
        value: "12"

      - key: LOG_LEVEL
        value: INFO

      # Allow requests from the Render frontend.
      # If you rename the frontend service, update this to match.
      - key: CORS_ORIGINS
        value: https://lenny-frontend-csll.onrender.com

      # Mark as secret — Render will prompt you to fill these in the dashboard.
      # Do NOT put real keys in this file.
      - key: ANTHROPIC_API_KEY
        sync: true

      - key: OPENAI_API_KEY
        sync: false

  # ── FRONTEND ──────────────────────────────────────────────
  - type: web
    name: lenny-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free
    envVars:
      # Passed as both a Docker build ARG and runtime env var.
      # The frontend Dockerfile accepts NEXT_PUBLIC_API_URL as an ARG.
      - key: NEXT_PUBLIC_API_URL
        value: https://lenny-backend-20wq.onrender.com
